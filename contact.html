<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#21103f">
    <title>Contact | Hello, World!</title>
    <style>
      * { box-sizing: border-box; }
      body {
        min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 2rem;
        color: #fff9eb; font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        background: radial-gradient(ellipse at 16% 20%, #ff4c9b 0, transparent 27%), radial-gradient(ellipse at 84% 78%, #00d5c0 0, transparent 30%), linear-gradient(135deg, #221044, #35115d 52%, #111a45);
      }
      main { width: min(100%, 680px); padding: clamp(2rem, 7vw, 4.5rem); border: 1px solid rgb(255 255 255 / 24%); border-radius: 2rem; background: rgb(255 255 255 / 8%); box-shadow: 0 0 70px rgb(0 213 192 / 18%); backdrop-filter: blur(8px); }
      .eyebrow { color: #73f7df; font-size: .8rem; font-weight: 800; letter-spacing: .3em; text-transform: uppercase; }
      h1 { margin: .5rem 0 1rem; font-size: clamp(2.8rem, 9vw, 5rem); line-height: 1; letter-spacing: -.06em; }
      h1 span { color: #ffd65a; }
      p { color: rgb(255 249 235 / 86%); font-size: 1.1rem; line-height: 1.75; }
      .email { display: inline-block; margin-top: .5rem; color: #73f7df; font-size: 1.15rem; font-weight: 700; text-decoration-thickness: 2px; text-underline-offset: 4px; }
      .email:hover, .email:focus-visible { color: #ffd65a; }
      nav { margin-top: 2rem; display: flex; gap: .8rem; flex-wrap: wrap; }
      nav a { padding: .7rem 1.15rem; border: 1px solid rgb(255 255 255 / 35%); border-radius: 999px; color: #fff9eb; font-size: .9rem; font-weight: 700; text-decoration: none; background: rgb(255 255 255 / 9%); transition: background .2s ease, transform .2s ease; }
      nav a:hover, nav a:focus-visible { background: #ff4c9b; transform: translateY(-2px); }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Say hello</p>
      <h1>Let’s <span>connect!</span></h1>
      <p>Got a question or just want to share a little good energy? Drop a note and say hello.</p>
      <a class="email" href="mailto:hello@example.com">hello@example.com</a>
      <nav aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html" aria-current="page">Contact</a>
      </nav>
    </main>
  </body>
</html>
