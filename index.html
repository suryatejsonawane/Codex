<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#21103f">
    <title>Hello, World!</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        color: #fff9eb;
        background:
          radial-gradient(ellipse at 16% 20%, #ff4c9b 0, transparent 27%),
          radial-gradient(ellipse at 84% 78%, #00d5c0 0, transparent 30%),
          linear-gradient(135deg, #221044, #35115d 52%, #111a45);
      }

      main {
        position: relative;
        width: min(90vw, 760px);
        padding: clamp(3rem, 9vw, 6.5rem) 1.5rem;
        text-align: center;
        isolation: isolate;
      }

      main::before {
        content: "";
        position: absolute;
        z-index: -1;
        inset: 5% 2%;
        border: 1px solid rgb(255 255 255 / 24%);
        border-radius: 48% 52% 43% 57% / 55% 42% 58% 45%;
        background: rgb(255 255 255 / 7%);
        box-shadow: 0 0 70px rgb(255 77 162 / 22%), inset 0 0 50px rgb(255 255 255 / 5%);
        backdrop-filter: blur(5px);
        transform: rotate(-4deg);
      }

      .eyebrow {
        margin: 0 0 1rem;
        color: #73f7df;
        font-size: .8rem;
        font-weight: 800;
        letter-spacing: .34em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(3.4rem, 12vw, 7.7rem);
        font-weight: 950;
        letter-spacing: -.075em;
        line-height: .95;
        text-shadow: 0 5px 0 #a52c8c, 0 12px 35px rgb(0 0 0 / 35%);
      }

      h1 span {
        display: block;
        color: #ffd65a;
        background: linear-gradient(90deg, #ffd65a, #ff8d74 48%, #ff68bd);
        background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 4px 0 #a52c8c);
      }

      .note {
        position: absolute;
        color: #ffd65a;
        font-size: clamp(2rem, 5vw, 3.5rem);
        animation: bob 3s ease-in-out infinite;
      }
      .note-one { top: 8%; left: 10%; transform: rotate(-15deg); }
      .note-two { top: 13%; right: 11%; color: #73f7df; animation-delay: -1.2s; }
      .note-three { bottom: 8%; left: 16%; color: #ff78bd; animation-delay: -.6s; }

      .caption {
        margin: 1.6rem 0 0;
        color: rgb(255 249 235 / 82%);
        font-size: clamp(1rem, 2.5vw, 1.25rem);
        letter-spacing: .04em;
      }

      @keyframes bob {
        0%, 100% { translate: 0 0; }
        50% { translate: 0 -10px; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <main>
      <span class="note note-one" aria-hidden="true">♫</span>
      <span class="note note-two" aria-hidden="true">♪</span>
      <span class="note note-three" aria-hidden="true">✦</span>
      <p class="eyebrow">A little page with a lot of groove</p>
      <h1>Hello,<span>World!</span></h1>
      <p class="caption">Turn up the color. Let the good vibes play.</p>
    </main>
  </body>
</html>
